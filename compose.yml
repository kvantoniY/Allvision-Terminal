services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: allvision
      POSTGRES_PASSWORD: allvision
      POSTGRES_DB: allvision
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U allvision"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  db_data:
